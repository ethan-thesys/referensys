<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Recording</title>
<style>
:root{--bg:#10181c;--ink:#e3ebef;--muted:#90a2ad;--rec:#f2546f;--btn:#22313a;--accent:#34b3a7;--accent-ink:#031d1b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
.bar{height:100%;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;-webkit-app-region:drag}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:p 1.3s infinite;flex:none}
.paused .dot{animation:none;opacity:.35}
@keyframes p{50%{opacity:.25}}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:13px}
.txt span{color:var(--muted);font-size:11.5px}
button{-webkit-app-region:no-drag;border:0;border-radius:7px;padding:8px 11px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;background:var(--btn);color:var(--ink)}
button.done{background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="bar" id="bar">
  <span class="dot"></span>
  <div class="txt"><b id="t">Recording</b><span id="n">Click to add steps</span></div>
  <button id="pause">Pause</button>
  <button class="done" id="done">Done</button>
</div>
<script>
const $=s=>document.querySelector(s);
$('#pause').onclick=()=>window.sop.pause();
$('#done').onclick=()=>window.sop.done();
window.sop.onPanelState(({count,paused})=>{
  $('#bar').classList.toggle('paused',paused);
  $('#t').textContent=paused?'Paused':'Recording';
  $('#n').textContent=count?`${count} step${count>1?'s':''}`:(paused?'Clicks are ignored':'Click to add steps');
  $('#pause').textContent=paused?'Resume':'Pause';
});
</script>
</body>
</html>
