# Builds the Windows installer, the Android app and the Chrome extension, and publishes a GitHub release (tagged v<version>) whenever the version
# in package.json changes on main. It can also be started by hand from the Actions tab.
# Installed copies of Referensys see the new release and update themselves.
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Add the Google sign-in key
        run: node -e "const {GOOGLE_CLIENT_ID:id,GOOGLE_CLIENT_SECRET:secret}=process.env;if(!id||!secret){console.error('Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET under Settings > Secrets and variables > Actions');process.exit(1)}require('fs').writeFileSync('google-client.json',JSON.stringify({id,secret}))"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - id: build
        run: .github/actions-android-build.sh
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Add the APK to the release
        if: steps.build.outputs.apk != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.build.outputs.version }}" "${{ steps.build.outputs.apk }}" --clobber
  extension:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-extension.js
      - name: Add the Chrome extension to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release upload "v$v" dist-extension/Referensys-Extension-*.zip --clobber
